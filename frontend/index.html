<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Cinesia - Sistema de estudos com resumos, flashcards e simulados para Fisioterapia" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="author" content="Kauan Kelvin" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Capability -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- PWA iOS/iPadOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cinesia" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Splash Screens iPad -->
    <link rel="apple-touch-startup-image" href="/apple-splash.png" />
    
    <!-- Prevenir zoom em inputs no iOS -->
    <meta name="format-detection" content="telephone=no" />
    
    <title>Cinesia Fisio</title>
    
    <!-- Tema Light Mode fixo -->
    <script>
      (function() {
        document.documentElement.classList.add('light');
        document.documentElement.style.colorScheme = 'light';
      })();
    </script>
    
    <!-- CSS para safe areas no iPad -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      /* Área de toque mínima para tablet */
      button, a, [role="button"] {
        min-height: 44px;
        min-width: 44px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
