name: Sync quality lockfiles

on:
  push:
    branches:
      - refactor/quality-gates-v2
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quality-gates-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh root workspace lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh frontend lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfiles
        run: |
          if git diff --quiet -- package-lock.json frontend/package-lock.json; then
            echo "Lockfiles already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json frontend/package-lock.json
          git commit -m "chore: sync quality tooling lockfiles"
          git push origin HEAD:refactor/quality-gates-v2
